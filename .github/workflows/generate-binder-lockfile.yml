name: Generate binder lockfile

on:
  push:
    branches:
      - feat/1-embeddable-game-binder

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout binder branch
        uses: actions/checkout@v4
        with:
          ref: feat/1-embeddable-game-binder
          token: ${{ github.token }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Generate frozen dependency state
        run: bun install
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: update binder lockfile"
          git push origin HEAD:feat/1-embeddable-game-binder
