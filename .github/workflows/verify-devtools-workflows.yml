name: Verify Devtools Workflows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Render managed workflows
        run: |
          bunx @ankhorage/ankh devtools workflows sync .
          printf '%s\n' '--- CI ---'
          cat .github/workflows/ci.yml
          printf '%s\n' '--- RELEASE ---'
          cat .github/workflows/release.yml
          printf '%s\n' '--- RENOVATE ---'
          cat .github/workflows/renovate.yml
